name: Generate NPM OIDC Token

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "NPM package name"
        required: false
        default: "oss-exit-gate-cronk"

jobs:
  generate-token:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate to Google Cloud (OSS EG WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

      - name: Set up gCloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Request OIDC Token and Exchange for NPM Token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const packageName = context.payload.inputs?.package_name || "cronk";
            const encodedPackage = encodeURIComponent(packageName);

            // 1. Request GitHub Actions OIDC ID Token with aud: "npm:registry.npmjs.org"
            const idToken = await core.getIDToken("npm:registry.npmjs.org");
            core.setSecret(idToken);

            // 2. Exchange OIDC ID Token for short-lived npm registry token
            const exchangeUrl = `https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodedPackage}`;
            const response = await fetch(exchangeUrl, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${idToken}`,
                "Accept": "application/json"
              }
            });

            if (!response.ok) {
              const errorBody = await response.text();
              core.setFailed(`NPM token exchange failed (${response.status}): ${errorBody}`);
              return;
            }

            const data = await response.json();
            const npmToken = data.token;

            // 3. Mask npm token in logs and set step output
            core.setSecret(npmToken);
            core.setOutput("npm_token", npmToken);

      - name: Update Secret in Secret Manager
        env:
          TOKEN: ${{ steps.oidc.outputs.npm_token }}
        run: |
          echo -n "${{ env.TOKEN }}" | gcloud secrets versions add "cronk--npm--oidc-token" \
            --project "oss-exit-gate-dev" \
            --data-file=-
