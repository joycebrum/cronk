on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel build keyring twine # Added twine here
          pip install -U keyrings.google-artifactregistry-auth

      - name: Build package
        run: |
          python3 -m build

      - uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

      # Replace the action with a direct twine call
      - name: Publish to Artifact Registry
        run: |
          twine upload --repository-url https://us-python.pkg.dev/oss-exit-gate-dev/cronk--testpypi dist/*
      - uses: google-github-actions/setup-gcloud@v1
      - run: |
          cat << EOF > wif_test.json
          {
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "cronk",
                    "version": "0.0.11"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp wif_test.json gs://oss-exit-gate-dev-projects-bucket/cronk/testpypi/manifests/wif_test.json --verbosity=debug --log-http
