on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with: # project 413555110372 is the ephemeral/experimental MultiOrg
          workload_identity_provider: projects/413555110372/locations/global/workloadIdentityPools/builders/providers/github
      - uses: google-github-actions/setup-gcloud@v1
      - run: |
          echo "test" > test.txt
          gcloud storage cp test.txt gs://oss-exit-gate-wif-test-bucket --verbosity=debug --log-http
